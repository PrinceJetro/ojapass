<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sign BMONI Proposal</title>
  </head>
  <body>
    <h1>Sign Proposal {{ proposal_id }}</h1>
    <p>Paste EIP-712 signature below (hex):</p>
    <textarea id="signature" rows="6" cols="80"></textarea><br/>
    <button id="submit">Submit Signature</button>
    <pre id="result"></pre>
    <script>
      document.getElementById('submit').addEventListener('click', async () => {
        const sig = document.getElementById('signature').value.trim();
        const res = await fetch(`/bmoni/proposals/{{ proposal_id }}/sign/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ signature: sig })
        });
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      });
    </script>
  </body>
</html>
